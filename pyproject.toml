[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyxsdata"
dynamic = ["version"]
description = "Modern Python XML & JSON Data Binding with Pydantic & Dataclasses support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "nth-bailey" },
]
maintainers = [
    { name = "nth-bailey" },
]
keywords = [
    "binding",
    "cli",
    "dataclasses",
    "dtd",
    "generator",
    "json",
    "pydantic",
    "schema",
    "wsdl",
    "xml",
    "xsd",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nth-bailey/pyxsdata"
Documentation = "https://nth-bailey.github.io/pyxsdata/"
Repository = "https://github.com/nth-bailey/pyxsdata"
Changelog = "https://nth-bailey.github.io/pyxsdata/changelog/"
Issues = "https://github.com/nth-bailey/pyxsdata/issues"

[project.scripts]
pyxsdata = "pyxsdata.__main__:main"

[project.entry-points."pyxsdata.plugins.cli"]
pydantic = "pyxsdata.pydantic.hooks.cli"

[project.entry-points."pyxsdata.plugins.class_types"]
pydantic = "pyxsdata.pydantic.hooks.class_type"

[project.optional-dependencies]
cli = [
    "click>=8.1.8",
    "jinja2>=3.1.5",
    "toposort>=1.10",
    "ruff>=0.9.8",
]
pydantic = [
    "pydantic>=2.10.0",
]
pugixml = [
    "pygixml>=0.12.0",
]
lxml = [
    "lxml>=5.3.0",
]
soap = [
    "requests>=2.32.3",
]
docs = [
    "zensical>=0.0.59",
]
test = [
    "pre-commit>=4.1.0",
    "pytest>=8.3.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.0.0",
]
all = [
    "pyxsdata[cli,lxml,soap,pydantic,pugixml]",
]

[dependency-groups]
dev = [
    "pyxsdata[all,test,docs]",
    "ty>=0.0.78",
    "types-lxml>=2026.2.16",
    "pre-commit>=4.1.0",
    "twine>=7.0.0",
    "build>=1.6.0",
]

[tool.hatch.version]
path = "pyxsdata/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pyxsdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--color=yes --benchmark-skip"
doctest_optionflags = "NORMALIZE_WHITESPACE"

[tool.coverage.run]
branch = true
source = ["pyxsdata"]
omit = [
    "pyxsdata/__main__.py",
    "pyxsdata/utils/debug.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
