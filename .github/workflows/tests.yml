name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Python 3.12, python: '3.12'}
          - {name: Python 3.13, python: '3.13'}
          - {name: Python 3.14, python: '3.14'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv pip install --system "git+https://github.com/nth-bailey/pyxsdata-core.git"
          uv pip install --system ".[all,test]"
      - name: Test
        run: |
          pytest --cov=./pyxsdata --cov-report=term-missing:skip-covered --cov-branch --doctest-glob="docs/*.md"
        continue-on-error: ${{ matrix.python == '3.14' }}
      - name: Generate Coverage Summary
        if: matrix.python == '3.12'
        run: |
          echo "### 📊 Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  type-check:
    name: Type Check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies & ty
        run: |
          uv pip install --system "git+https://github.com/nth-bailey/pyxsdata-core.git"
          uv pip install --system ".[all,test]" ty types-lxml
      - name: ty check
        run: |
          ty check pyxsdata

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv pip install --system "git+https://github.com/nth-bailey/pyxsdata-core.git"
          uv pip install --system ".[all,test]"
      - name: Benchmark
        run: |
          pytest --benchmark-only --benchmark-columns=min,max,mean,median tests/integration/benchmarks

  minimum:
    name: Minimum Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: |
          uv pip install --system -e ".[test]"
      - name: Verify
        run: |
          python benchmark.py -c XmlEventWriter
          python benchmark.py -c XmlEventHandler
          python benchmark.py -c JsonParser
          python benchmark.py -c JsonSerializer
          pyxsdata | xargs -0 python -c "import sys; assert 'Install cli' in sys.argv[1]"

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv pip install --system "git+https://github.com/nth-bailey/pyxsdata-core.git"
          uv pip install --system ".[all,test]" pre-commit ty types-lxml
      - name: Run pre-commit
        run: |
          pre-commit run --all-files

  check-package:
    name: Build & Inspect Package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: hynek/build-and-inspect-python-package@v2
